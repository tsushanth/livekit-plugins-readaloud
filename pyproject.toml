[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "livekit-plugins-readaloud"
version = "0.1.0"
description = "ReadAloud text-to-speech plugin for LiveKit Agents (Piper voices, ~200 ms to first audio, 8 kHz telephony output)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sushanth Tiruvaipati" }]
keywords = ["livekit", "livekit-agents", "tts", "text-to-speech", "voice-agent", "readaloud", "piper"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]
# Tested against livekit-agents 1.8.5 (tts.TTS / ChunkedStream / SynthesizeStream / AudioEmitter).
dependencies = ["livekit-agents>=1.8,<2", "aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://readaloudai.org"
Repository = "https://github.com/tsushanth/livekit-plugins-readaloud"

[tool.setuptools.packages.find]
include = ["livekit.plugins.readaloud*"]

[tool.setuptools.package-data]
"livekit.plugins.readaloud" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
